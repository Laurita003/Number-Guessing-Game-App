<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Number Guessing Game</h1>
        <p class="description">Errate die geheime Zahl zwischen 1 und 100!</p>

        <!-- ÉCRAN DE SÉLECTION DE DIFFICULTÉ -->
        <div id="setup-screen">
            <div class="subtitle">Wählen Sie den Schwierigkeitsgrad:</div>
            <div class="difficulty-buttons">
                <button class="diff-btn easy" onclick="startGame(10)">Leicht (10 Versuche)</button>
                <button class="diff-btn normal" onclick="startGame(7)">Normal (7 Versuche)</button>
                <button class="diff-btn hard" onclick="startGame(5)">Schwer (5 Versuche)</button>
            </div>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen" class="hidden">
            <div class="stats">
                Verbleibende Versuche: <span id="attempts-left" style="color: #f8fafc; font-weight: bold;">7</span> / <span id="max-attempts">7</span>
            </div>

            <div class="form-group" style="margin-top: 1.2rem;">
                <label for="guess-input">Geben Sie eine Zahl ein:</label>
                <input type="number" id="guess-input" min="1" max="100" placeholder="1 - 100">
            </div>
            <button class="action-btn" id="guess-btn">Vorschlag prüfen</button>

            <div id="game-message" class="message hidden"></div>

            <div class="stats" style="margin-top: 1.2rem; text-align: left;">Bisherige Versuche:</div>
            <div id="history-box" class="history">Keine Versuche bisher.</div>
        </div>

        <!-- ÉCRAN DE FIN -->
        <div id="end-screen" class="hidden">
            <div id="end-message" class="message"></div>
            <button class="action-btn" id="restart-btn" style="margin-top: 1.5rem;">Nochmal spielen</button>
        </div>
    </div>

    <!-- Lien vers le fichier JavaScript externe -->
    <script src="script.js"></script>
</body>
</html>
